name: "Sync Turning Point (David Jeremiah) to Google Drive"

on:
  schedule:
    - cron: "0 1 * * *"
    - cron: "0 5 * * *"
    - cron: "0 9 * * *"
    - cron: "0 13 * * *"
    - cron: "0 17 * * *"
    - cron: "0 21 * * *"
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # Không push repo => khỏi dính 403. State lưu trên Drive.
    permissions:
      contents: read

    env:
      MAX_PER_RUN: "10"
      SLEEP_SECONDS: "2"
      HTTP_TIMEOUT: "40"
      OUT_DIR: "out"

      # BẮT BUỘC set trong Secrets
      GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
      GDRIVE_OAUTH_TOKEN_JSON: ${{ secrets.GDRIVE_OAUTH_TOKEN_JSON }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade requests google-api-python-client google-auth google-auth-httplib2

      - name: Run sync
        run: |
          python -u sync_turningpoint_to_drive.py
