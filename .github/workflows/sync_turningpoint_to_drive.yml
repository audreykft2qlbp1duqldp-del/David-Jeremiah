name: Sync Turning Point -> Drive

on:
  schedule:
    - cron: "0 1 * * *"
    - cron: "0 5 * * *"
    - cron: "0 9 * * *"
    - cron: "0 13 * * *"
    - cron: "0 17 * * *"
    - cron: "0 21 * * *"
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      MAX_PER_RUN: "10"
      SLEEP_SECONDS: "3"
      HTTP_TIMEOUT: "30"
      OUT_DIR: "out"

      GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
      GDRIVE_OAUTH_TOKEN_JSON: ${{ secrets.GDRIVE_OAUTH_TOKEN_JSON }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade \
            requests \
            google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib

      - name: Run sync
        run: |
          python -u sync_turningpoint_to_drive.py
