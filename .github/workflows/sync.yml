name: Sync Turning Point Audio -> Google Drive

on:
  schedule:
    - cron: "15 1 * * *"   # 08:15 VN (UTC+7)
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
      GDRIVE_OAUTH_TOKEN_JSON: ${{ secrets.GDRIVE_OAUTH_TOKEN_JSON }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests beautifulsoup4 google-api-python-client google-auth google-auth-httplib2

      - name: Run sync & upload to Drive
        run: |
          python -u sync_turningpoint_to_drive.py
